packages:
  - packages/*

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  lefthook: true
  nx: true

catalog:
  "@types/node": ^26.1.2
  "@typescript/native": "npm:typescript@^7.0.2"
  typescript: "npm:@typescript/typescript6@^6.0.2"
  tsup: ^8.5.1
  tsx: ^4.23.11
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10

strictPeerDependencies: true
autoInstallPeers: false

# Nx 23.1.1 contains the transitive audit fixes required by this migration.
# Keep the pnpm 11 maturity exception exact and scoped to this release.
minimumReleaseAgeExclude:
  - "nx@23.1.1"
  - "@nx/devkit@23.1.1"
  - "@nx/js@23.1.1"
  - "@nx/nx-darwin-arm64@23.1.1"
  - "@nx/nx-darwin-x64@23.1.1"
  - "@nx/nx-freebsd-x64@23.1.1"
  - "@nx/nx-linux-arm-gnueabihf@23.1.1"
  - "@nx/nx-linux-arm64-gnu@23.1.1"
  - "@nx/nx-linux-arm64-musl@23.1.1"
  - "@nx/nx-linux-x64-gnu@23.1.1"
  - "@nx/nx-linux-x64-musl@23.1.1"
  - "@nx/nx-win32-arm64-msvc@23.1.1"
  - "@nx/nx-win32-x64-msvc@23.1.1"
  - "@nx/workspace@23.1.1"
